<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dozy · Choose a character portrait</title>
  <link rel="stylesheet" href="../screens/styles.css">
  <link rel="stylesheet" href="../brand.css">
  <link rel="stylesheet" href="avatars.css">
  <script src="avatars.js" defer></script>
</head>
<body>
  <aside class="review">
    <a class="wordmark" href="index.html"><img class="brand-icon" src="../images/dozy-sleepy-cloud.png" alt="">dozy</a>
    <h1>Character portraits</h1>
    <p>Choose a character type and adjust the portrait directly in the form.</p>
    <div class="style-references" aria-label="Dozy illustration references">
      <img src="../images/KHLJYBWmykU.png" alt="Child in a yellow hoodie">
      <img src="../images/8axferlVmRg.png" alt="Pirate with a red bandana">
      <img src="../images/2Q5txgx3rfS.png" alt="Small teal dragon">
    </div>
    <a href="../screens/index.html">← Screen references</a>
  </aside>
  <div class="device">
    <div class="toolbar-region">
      <div class="statusbar"><span>9:41</span><span aria-hidden="true">◒ ▰</span></div>
      <header class="topbar">
        <button class="icon-button" id="back" aria-label="Go back" hidden>←</button>
        <span class="topbar-spacer" id="left-space"></span>
        <span id="toolbar-title">CHARACTERS</span>
        <button class="icon-button" id="add" aria-label="Add character">＋</button>
        <span class="topbar-spacer" id="right-space" hidden></span>
      </header>
    </div>
    <main class="content">
      <section id="characters">
        <h1>Your characters</h1>
        <p class="intro">Familiar faces for tonight’s story.</p>
        <div id="cast" class="character-grid"></div>
      </section>
      <form id="character" hidden>
        <h1 id="form-title">New character</h1>

        <div class="segmented" id="type" role="group" aria-label="Character type">
          <button type="button" data-type="person" aria-pressed="true">Person</button>
          <button type="button" data-type="animal" aria-pressed="false">Animal</button>
          <button type="button" data-type="fantasy" aria-pressed="false">Make-believe</button>
        </div>
        <section class="portrait-editor" aria-label="Character portrait">
          <div class="portrait-stage"><canvas id="preview" class="portrait portrait-preview" width="144" height="144" role="img" aria-label="Portrait preview"></canvas></div>
          <div id="controls" class="portrait-controls"></div>
        </section>
        <label class="form-label" for="name">Name</label>
        <input id="name" class="form-field" placeholder="e.g. Oliver" required maxlength="80">
        <label class="form-label" for="personality">Personality</label>
        <textarea id="personality" rows="2" placeholder="What are they like?"></textarea>
        <label class="form-label" for="appearance">Appearance in the story <span class="optional">Optional</span></label>
        <textarea id="appearance" rows="2" placeholder="e.g. Yellow rain boots and round glasses"></textarea>
        <p class="muted">These details help tell the story. The portrait stays as you chose it.</p>
        <button class="button primary" type="submit">Save character</button>
      </form>
    </main>
  </div>
</body>
</html>
