[versions]
kotlin = "2.3.21"
agp = "8.13.2"
compose = "1.10.3"
material3 = "1.9.0"
ksp = "2.3.12"
room = "3.0.3"
sqlite = "2.6.2"
ktor = "3.6.0"
koin = "4.1.1"
coroutines = "1.10.2"
serialization = "1.11.0"
ktlint = "14.2.0"
coil = "3.3.0"
work-runtime-ktx = "2.10.1"
activity-compose = "1.9.3"
material-icons-extended = "1.7.3"
navigation-compose = "2.9.8"
junit = "4.13.2"
robolectric = "4.16.1"

lifecycle = "2.10.0"
savedstate = "1.4.0"

[libraries]
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose" }
savedstate = { module = "org.jetbrains.androidx.savedstate:savedstate", version.ref = "savedstate" }
work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work-runtime-ktx" }
