ktor:
  application:
    modules:
      - com.dozy.ApplicationKt.module
  deployment:
    host: "${HOST:0.0.0.0}"
    port: "${PORT:8080}"
dozy:
  auth:
    secret: "${DOZY_AUTH_SECRET:local-development-auth-secret-change-before-deployment}"
  database:
    path: "${DOZY_DATABASE_PATH:data/dozy.db}"
    busyTimeoutMillis: "${DOZY_DATABASE_BUSY_TIMEOUT_MS:5000}"
  generation:
    textMode: "${DOZY_STORY_TEXT_MODE:SUCCESS}"
    coverMode: "${DOZY_STORY_COVER_MODE:SUCCESS}"
    delayMillis: "${DOZY_STORY_DELAY_MS:250}"
    concurrency: "${DOZY_STORY_CONCURRENCY:2}"
    assetBaseUrl: "${DOZY_ASSET_BASE_URL:https://localhost:8080}"
    allowHttp: "${DOZY_ASSET_ALLOW_HTTP:false}"
  avatars:
    storagePath: "${DOZY_AVATAR_STORAGE_PATH:data/assets}"
    publicBaseUrl: "${DOZY_ASSET_PUBLIC_BASE_URL:https://localhost:8080}"
    allowLocalHttp: "${DOZY_ASSET_ALLOW_LOCAL_HTTP:false}"
    mode: "${DOZY_AVATAR_MODE:SUCCESS}"
    delayMillis: "${DOZY_AVATAR_DELAY_MS:1000}"
    concurrency: "${DOZY_AVATAR_CONCURRENCY:2}"
